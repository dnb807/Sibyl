services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: fortuneteller
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - fortuneteller-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGUSER: postgres
      PGPASSWORD: "123"
      PGDATABASE: fortuneteller
      DB_HOST: database
    ports:
      - "5000:5000"
    networks:
      - fortuneteller-network

networks:
  fortuneteller-network:
    driver: bridge
